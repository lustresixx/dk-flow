workflow:
  name: 缺陷定位与修复
  description: 完成问题复现、根因分析、修复和回归验证（AI 判断成功/失败）
  mode: state-machine
  maxTransitions: 30
  supervisor:
    enabled: true
    agent: default-supervisor
    stageReviewEnabled: true
    checkpointAdviceEnabled: true
    scoringEnabled: true
    experienceEnabled: true
  states:
    - name: 复现
      description: 建立稳定、最小且可观测的复现场景
      isInitial: true
      isFinal: false
      maxSelfTransitions: 3
      position: { x: 60, y: 180 }
      steps:
        - { name: 构造复现, agent: issue-reproducer, role: defender, task: 根据问题描述构造稳定复现并记录环境与现象 }
        - { name: 复现挑战, agent: code-hunter, role: attacker, task: 检查复现是否最小、稳定并排除环境噪声 }
        - { name: 复现裁决, agent: code-judge, role: judge, task: 评估复现证据是否成立，给出 verdict }
      transitions:
        - { to: 定位, condition: { verdict: success }, priority: 10, label: 复现确认 }
        - { to: 复现, condition: { verdict: fail }, priority: 20, label: 重建复现 }
    - name: 定位
      description: 收敛根因并评估影响范围
      isInitial: false
      isFinal: false
      maxSelfTransitions: 3
      position: { x: 330, y: 180 }
      steps:
        - { name: 根因分析, agent: architect, role: defender, task: 基于复现定位根因、触发条件和影响范围 }
        - { name: 根因挑战, agent: code-hunter, role: attacker, task: 提出替代解释并检查证据链缺口 }
        - { name: 定位裁决, agent: code-judge, role: judge, task: 判断根因是否充分，给出 verdict }
      transitions:
        - { to: 修复, condition: { verdict: success }, priority: 10, label: 根因确认 }
        - { to: 复现, condition: { verdict: fail }, priority: 20, label: 返回复现 }
    - name: 修复
      description: 实施最小修复并完成代码评审
      isInitial: false
      isFinal: false
      maxSelfTransitions: 3
      position: { x: 600, y: 180 }
      steps:
        - { name: 实施修复, agent: developer, role: defender, task: 针对已确认根因实施聚焦修复并补充测试 }
        - { name: 修复审查, agent: code-hunter, role: attacker, task: 检查回归风险、兼容性和测试覆盖 }
        - { name: 修复裁决, agent: code-judge, role: judge, task: 综合实现与审查结果，给出 verdict }
      transitions:
        - { to: 验证, condition: { verdict: success }, priority: 10, label: 修复通过 }
        - { to: 定位, condition: { verdict: fail }, priority: 20, label: 根因复核 }
    - name: 验证
      description: 执行复现关闭、回归和边界验证
      isInitial: false
      isFinal: false
      maxSelfTransitions: 3
      position: { x: 870, y: 180 }
      steps:
        - { name: 回归验证, agent: tester, role: defender, task: 验证原问题关闭并执行相关回归测试 }
        - { name: 边界攻击, agent: stress-tester, role: attacker, task: 覆盖异常、边界和压力场景，寻找回归 }
        - { name: 验证裁决, agent: code-judge, role: judge, task: 判断问题是否关闭、验证是否充分，给出 verdict }
      transitions:
        - { to: 完成, condition: { verdict: success }, priority: 10, label: 验证通过 }
        - { to: 修复, condition: { verdict: fail }, priority: 20, label: 返回修复 }
    - name: 完成
      description: 汇总修复内容与验证证据
      isInitial: false
      isFinal: true
      position: { x: 1140, y: 180 }
      steps:
        - { name: 修复汇总, agent: documentation-writer, role: defender, task: 汇总根因、修复内容、验证证据与残余风险 }
      transitions: []
context:
  projectRoot: ""
  workspaceMode: in-place
  requirements: ""
  taskInput:
    fields:
      - id: title
        label: 问题标题
        type: text
        placeholder: "例如：启动时偶发崩溃"
      - id: description
        label: 问题描述
        type: textarea
        placeholder: 描述现象、触发条件、环境与已有线索
